<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" rx="22" fill="#0a0808"/>

  <!-- Outer hexagon -->
  <polygon
    points="50,6 88,28 88,72 50,94 12,72 12,28"
    fill="none" stroke="#c9a96e" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner hexagon fill -->
  <polygon
    points="50,18 78,34 78,66 50,82 22,66 22,34"
    fill="#c9a96e" fill-opacity="0.08"/>

  <!-- FX text -->
  <text x="50" y="66"
    font-family="Georgia, serif"
    font-size="36" font-weight="700"
    fill="#c9a96e" text-anchor="middle"
    filter="url(#glow)">FX</text>
</svg>
